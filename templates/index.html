<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HarvestIQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(to bottom, #fff8c8, #ffffff 50%, #c8f3d0);
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-center p-4">

  <!-- Center Card -->
  <div class="bg-white shadow-2xl rounded-3xl p-12 text-center max-w-xl w-full">

    <!-- Logo + Name -->
    <div class="flex justify-center items-center gap-2 mb-4">
      <img src="https://cdn-icons-png.flaticon.com/512/7660/7660445.png" class="w-12 h-12" />
      <h1 class="text-4xl font-extrabold text-green-700">HarvestIQ</h1>
    </div>

    <!-- Tagline -->
    <p class="text-gray-600 text-lg mb-8 font-medium">Smart Farming • AI Insights • Greener Future</p>

    <!-- Features -->
    <div class="flex justify-center gap-5 mb-10 flex-wrap">
      <div class="bg-white shadow-md p-5 rounded-2xl w-32 hover:shadow-xl transition-all">
        <img src="https://cdn-icons-png.flaticon.com/512/2907/2907155.png" class="w-10 mx-auto mb-2" />
        <p class="font-medium">Soil Health</p>
      </div>

      <div class="bg-white shadow-md p-5 rounded-2xl w-32 hover:shadow-xl transition-all">
        <img src="https://cdn-icons-png.flaticon.com/512/1163/1163624.png" class="w-10 mx-auto mb-2" />
        <p class="font-medium">Climate</p>
      </div>

      <div class="bg-white shadow-md p-5 rounded-2xl w-32 hover:shadow-xl transition-all">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" class="w-10 mx-auto mb-2" />
        <p class="font-medium">Insights</p>
      </div>
    </div>

    <!-- Button -->
    <a href="{{ url_for('signup') }}"
       class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-full text-lg font-semibold shadow-lg flex items-center gap-2 mx-auto transition block text-center">
      Get Started 🚜
    </a>

  </div>

</body>
</html>
