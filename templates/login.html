<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarvestIQ - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Frosted glass effect */
    .glass-box {
      background: rgba(255, 255, 255, 0.30);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    video { filter: none !important; }
  </style>
</head>

<body class="relative min-h-screen flex items-center justify-center">


  <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-fill">
    <source src="{{ url_for('static', filename='signup-bg_1.mp4') }}" type="video/mp4">
  </video>
  


  <div class="absolute inset-0 bg-black bg-opacity-40"></div>


  <div class="glass-box shadow-xl rounded-2xl p-8 w-full max-w-md relative z-10">

    <h2 class="text-3xl font-bold text-center text-white mb-6">Welcome Back 🌿</h2>

    <form action="{{ url_for('login') }}" method="POST">
      <div class="mb-4">
        <label class="block text-white mb-1 font-semibold">Email</label>
        <input type="email" name="email"
          class="w-full p-3 border rounded-lg bg-white bg-opacity-70 focus:outline-none focus:ring focus:ring-green-300"
          required>
      </div>

      <div class="mb-6">
        <label class="block text-white mb-1 font-semibold">Password</label>
        <input type="password" name="password"
          class="w-full p-3 border rounded-lg bg-white bg-opacity-70 focus:outline-none focus:ring focus:ring-green-300"
          required>
      </div>

      <button type="submit"
        class="w-full bg-green-600 text-white p-3 rounded-lg text-lg font-semibold hover:bg-green-700 transition">
        Login
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="{{ url_for('signup') }}" class="text-white hover:underline text-sm">Don't have an account? Sign Up</a>
      <br>
      <a href="{{ url_for('index') }}" class="text-gray-200 hover:underline text-sm">Back to Home</a>
    </div>

  </div>

</body>
</html>
