<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarvestIQ - Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#e8f5e9] flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md border border-green-200">

    <h2 class="text-3xl font-bold text-center text-green-700 mb-6">Create Account 🌱</h2>

    <form>
      <div class="mb-4">
        <label class="block text-green-700 mb-1 font-semibold">Name</label>
        <input type="text" class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-green-300" required>
      </div>

      <div class="mb-4">
        <label class="block text-green-700 mb-1 font-semibold">Email</label>
        <input type="email" class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-green-300" required>
      </div>

      <div class="mb-6">
        <label class="block text-green-700 mb-1 font-semibold">Password</label>
        <input type="password" class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-green-300" required>
      </div>

      <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg text-lg font-semibold hover:bg-green-700 transition">
        Sign Up
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="login.html" class="text-green-700 hover:underline text-sm">Already have an account? Login</a>
      <br>
      <a href="index.html" class="text-gray-600 hover:underline text-sm">Back to Home</a>
    </div>

  </div>
</body>
</html>
