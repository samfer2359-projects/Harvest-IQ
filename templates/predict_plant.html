<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Prediction</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e6f4ea;
      color: #2f4f2f;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2e7d32;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1b5e20;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background-color: #f0fff0;
      border-left: 5px solid #2e7d32;
    }
    a {
      width: 100%;
      padding: 10px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    a:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
<body>

    <header>
        <h1>Plant Disease Prediction</h1>
    </header>

    <div class="container">
        <form action="/predict_plant" method="POST" enctype="multipart/form-data">
            <input type="file" name="image" accept="image/*" required>
            <input type="submit" value="Upload and Predict">
        </form>

        {% if result %}
        <div class="result-box">
            <h3>Prediction Result:</h3>
            <textarea rows="2" readonly>{{ result }}</textarea>
        </div>

        <div class="result-box">
            <h3>Treatment Suggestion:</h3>
            <textarea rows="10" readonly>{{ suggestion }}</textarea>
        </div>
        {% endif %}
    </div>

    <a href="{{ url_for('welcome') }}" class="btn">Back to Home</a>

</body>
</html>
