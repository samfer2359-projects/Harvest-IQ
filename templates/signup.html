<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarvestIQ - Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Frosted Glass */
    .glass-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    video {
  filter: none !important;
}

  </style>
</head>

<body class="relative min-h-screen flex items-center justify-center overflow-hidden">


  <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-fill">
  <source src="{{ url_for('static', filename='signup-bg_1.mp4') }}" type="video/mp4">
</video>

  


  <div class="absolute inset-0 bg-black/50"></div>

  <div class="glass-box shadow-2xl rounded-2xl p-10 w-full max-w-md relative z-10">

    <h2 class="text-3xl font-bold text-center text-white mb-8">Create Account 🌱</h2>

    <form action="/signup" method="POST" class="space-y-5">

      <div>
        <label class="block text-white mb-1 font-semibold">Name</label>
        <input type="text" name="name" class="w-full p-3 border rounded-lg bg-white bg-opacity-40 focus:outline-none focus:ring focus:ring-green-400" required>
      </div>

      <div>
        <label class="block text-white mb-1 font-semibold">Email</label>
        <input type="email" name="email" class="w-full p-3 border rounded-lg bg-white bg-opacity-40 focus:outline-none focus:ring focus:ring-green-400" required>
      </div>

      <div>
        <label class="block text-white mb-1 font-semibold">Password</label>
        <input type="password" name="password" class="w-full p-3 border rounded-lg bg-white bg-opacity-40 focus:outline-none focus:ring focus:ring-green-400" required>
      </div>

      <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg text-lg font-semibold hover:bg-green-700 transition-all">Sign Up</button>
    </form>

    <div class="text-center mt-5 space-y-1">
      <a href="{{ url_for('login') }}" class="text-white hover:underline text-sm">Already have an account? Login</a><br>
      <a href="{{ url_for('index') }}" class="text-gray-300 hover:underline text-sm">Back to Home</a>
    </div>

  </div>

</body>
</html>
