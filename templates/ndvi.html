<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDVI Calculation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header>
        <h1>NDVI Calculation</h1>
    </header>

    <div class="container">
        <form action="/ndvi" method="POST">
            <input type="number" name="lon_min" placeholder="Longitude Min" required>
            <input type="number" name="lat_min" placeholder="Latitude Min" required>
            <input type="number" name="lon_max" placeholder="Longitude Max" required>
            <input type="number" name="lat_max" placeholder="Latitude Max" required>
            <input type="text" name="time_range" placeholder="Time Range (e.g. 2025-01-01/2025-01-10)" required>
            <input type="submit" value="Calculate NDVI">
        </form>

        {% if ndvi_result %}
        <div class="result-box">
            <h3>NDVI Calculation Result:</h3>
            <p>{{ ndvi_result }}</p>
            
            {% if ndvi_image_path %}
                <div class="ndvi-image">
                    <h4>NDVI Visualization</h4>
                    <!-- <img src="{{ url_for('static', filename=ndvi_image_path) }}" alt="NDVI Image">  -->
                    <!-- Display NDVI plot -->
                    <img src="{{ url_for('static', filename='ndvi_output/ndvi_plot.png') }}" alt="NDVI Plot">

                    <!-- Provide link to download NDVI NetCDF file -->
                    <a href="{{ url_for('static', filename='ndvi_output/ndvi_output.nc') }}" download>Download NDVI NetCDF File</a>

                </div>
            {% endif %}
        </div>
        {% endif %}
    </div>

    <a href="/" class="btn">Back to Home</a>

</body>
</html>
