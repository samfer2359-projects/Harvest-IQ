<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Harvest IQ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e6f4ea;
      color: #2f4f2f;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2em;
    }
    .buttons {
      margin-top: 30px;
    }
    button {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    footer {
      text-align: center;
      padding: 10px;
      background-color: #a8d5ba;
      color: white;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Welcome, {{ username }}!</h1>
  <p>Thank you for using Harvest IQ 🌱</p>

  <div class="buttons">
    <button onclick="window.location.href='/ndvi'">NDVI Analysis</button>
    <button onclick="window.location.href='/fertilizer'">Fertilizer Recommendation</button>
    <button onclick="window.location.href='/recommend_crop'">Crop Recommendation</button>
    <button onclick="window.location.href='/predict_plant'">Plant Disease Detection</button>
    <button onclick="window.location.href='/'">Logout</button>
  </div>

  <footer>
    © 2025 Harvest IQ - College Project by Neha Jaiswal
  </footer>
</body>
</html>
